services:
  frontend:
  build:
    context: ./frontend
  ports:
    - "3000:3000"
  volumes:
    - ./frontend:/app
    - /app/node_modules
  working_dir: /app
  command: npm run dev

  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    # Use shared .env so the backend can read FRONTEND_URL and JWT_SECRET during development.
    env_file:
      - .env
    working_dir: /app
    command: npm run dev
    depends_on:
      - db

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: marae_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: