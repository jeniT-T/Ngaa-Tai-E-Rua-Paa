services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    command: npm run dev

  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:password@db:5432/marae_db}
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      CREATE_ADMIN_EMAIL: ${CREATE_ADMIN_EMAIL:-admin@example.com}
      CREATE_ADMIN_PASSWORD: ${CREATE_ADMIN_PASSWORD:-StrongPassword123}
      CREATE_ADMIN_NAME: ${CREATE_ADMIN_NAME:-Admin Name}
    working_dir: /app
    command: npm run start
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: marae_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marae_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: